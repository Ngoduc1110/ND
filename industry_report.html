            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
            color: #fff;
        }
        
        .chart-container {
            background: #fff;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            overflow: hidden;

        .footer { margin-top: 4rem; text-align: center; color: var(--text-dim); font-size: 0.9rem; }
